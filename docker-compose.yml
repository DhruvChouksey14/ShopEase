# Local development only. Elasticsearch security is disabled in this compose file.
name: shopease-backend

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopease-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - postgres
    networks:
      - shopease-network

  redis:
    image: redis/redis-stack:6.2.6-v19
    container_name: redis
    restart: always
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"
    volumes:
      - redis_data:/data
    networks:
      - shopease-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - shopease-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - shopease-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: shopease-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - shopease-network

  # ─── RabbitMQ — background job queues (invoice generation, retry/DLQ) ──────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-shopease}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # Management UI — credentials come from root .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - shopease-network

  ai-service:
    build:
      context: .
      dockerfile: server/ai-service/Dockerfile
    container_name: ai-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4009
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      KAFKA_BROKER: kafka:9092
      SEARCH_SERVICE_URL: ${AI_SEARCH_SERVICE_URL:-http://host.docker.internal:4002}
      CATALOG_SERVICE_URL: ${AI_CATALOG_SERVICE_URL:-http://host.docker.internal:4003}
      INVENTORY_SERVICE_URL: ${AI_INVENTORY_SERVICE_URL:-http://host.docker.internal:4007}
      CART_SERVICE_URL: ${AI_CART_SERVICE_URL:-http://host.docker.internal:4008}
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:4010
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
    ports:
      - "127.0.0.1:4009:4009"
    depends_on:
      - redis
      - kafka
    networks:
      - shopease-network

  recommendation-service:
    build:
      context: .
      dockerfile: server/recommendation-service/Dockerfile
    container_name: recommendation-service
    restart: unless-stopped
    environment:
      PORT: 4010
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      KAFKA_BROKER: kafka:9092
      DATA_SOURCE: ${RECOMMENDATION_DATA_SOURCE:-dataset}
      MODEL_DIR: /models
      DATABASE_URL: ${RECOMMENDATION_DATABASE_URL:-postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/postgres}
      ENABLE_CONSUMER: "true"
      ENABLE_RETRAINING: ${RECOMMENDATION_ENABLE_RETRAINING:-false}
      DATA_DIR: /data
      RETRAIN_AFTER_INTERACTIONS: ${RECOMMENDATION_RETRAIN_AFTER_INTERACTIONS:-1000}
    ports:
      - "127.0.0.1:4010:4010"
    depends_on:
      - redis
      - kafka
      - postgres
    volumes:
      - recommendation_models:/models
      - ./data:/data:ro
    networks:
      - shopease-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - shopease-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    restart: always
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - shopease-network

  # ─── Observability ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets Prometheus scrape services running on the host (npm run dev)
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # http://localhost:9090
    networks:
      - shopease-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000" # http://localhost:3001 — add Prometheus (http://prometheus:9090) as a data source
    networks:
      - shopease-network

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  es_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  recommendation_models:

networks:
  shopease-network:
    driver: bridge
