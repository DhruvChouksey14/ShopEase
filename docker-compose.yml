# Local development only. Elasticsearch security is disabled in this compose file.
name: shopease-backend

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - shopease-network

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - postgres
    networks:
      - shopease-network

  redis:
    image: redis/redis-stack:6.2.6-v19
    container_name: redis
    restart: always
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"
    volumes:
      - redis_data:/data
    networks:
      - shopease-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - shopease-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - shopease-network

  kafka-ui:
    profiles: ["tools"]
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: shopease-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - shopease-network

  # ─── RabbitMQ — background job queues (invoice generation, retry/DLQ) ──────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-shopease}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # Management UI — credentials come from root .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - shopease-network

  ai-service:
    build:
      context: .
      dockerfile: server/ai-service/Dockerfile
    container_name: ai-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4009
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      KAFKA_BROKER: kafka:9092
      SEARCH_SERVICE_URL: http://search-service:4002
      CATALOG_SERVICE_URL: http://catalog-service:4003
      INVENTORY_SERVICE_URL: http://inventory-service:4007
      CART_SERVICE_URL: http://cart-service:4008
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:4010
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
    ports:
      - "127.0.0.1:4009:4009"
    depends_on:
      - redis
      - kafka
      - search-service
      - catalog-service
      - inventory-service
      - cart-service
    networks:
      - shopease-network

  recommendation-service:
    build:
      context: .
      dockerfile: server/recommendation-service/Dockerfile
    container_name: recommendation-service
    restart: unless-stopped
    environment:
      PORT: 4010
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      KAFKA_BROKER: kafka:9092
      DATA_SOURCE: ${RECOMMENDATION_DATA_SOURCE:-dataset}
      MODEL_DIR: /models
      DATABASE_URL: ${RECOMMENDATION_DATABASE_URL:-postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/postgres}
      ENABLE_CONSUMER: "true"
      ENABLE_RETRAINING: ${RECOMMENDATION_ENABLE_RETRAINING:-false}
      DATA_DIR: /data
      RETRAIN_AFTER_INTERACTIONS: ${RECOMMENDATION_RETRAIN_AFTER_INTERACTIONS:-1000}
    ports:
      - "127.0.0.1:4010:4010"
    depends_on:
      - redis
      - kafka
      - postgres
    volumes:
      - ./server/recommendation-service/models:/models:ro
      - ./data:/data:ro
    networks:
      - shopease-network

  user-service:
    build:
      context: .
      dockerfile: server/user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      PORT: 4001
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopease}:${POSTGRES_PASSWORD}@postgres:5432/user_db?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: user-service
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-disabled}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-local-disabled}
      MAIL_SEND: ${MAIL_SEND:-local@example.test}
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - shopease-network

  search-service:
    build:
      context: .
      dockerfile: server/search-service/Dockerfile
    container_name: search-service
    restart: unless-stopped
    environment:
      PORT: 4002
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: search-service
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - elasticsearch
      - kafka
    networks:
      - shopease-network

  catalog-service:
    build:
      context: .
      dockerfile: server/catalog-service/Dockerfile
    container_name: catalog-service
    restart: unless-stopped
    environment:
      PORT: 4003
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopease}:${POSTGRES_PASSWORD}@postgres:5432/catalog_db?schema=public
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: catalog-service
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - postgres
      - kafka
    networks:
      - shopease-network

  notification-service:
    build:
      context: .
      dockerfile: server/notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    environment:
      PORT: 4004
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-local-disabled}
      MAIL_SEND: ${MAIL_SEND:-local@example.test}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - kafka
    networks:
      - shopease-network

  order-service:
    build:
      context: .
      dockerfile: server/order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: 4005
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopease}:${POSTGRES_PASSWORD}@postgres:5432/order_db?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: order-service
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-shopease}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      INVENTORY_SERVICE_URL: http://inventory-service:4007
      PAYMENT_SERVICE_URL: http://payment-service:4006
      USER_SERVICE_URL: http://user-service:4001
      CATALOG_SERVICE_URL: http://catalog-service:4003
      CART_SERVICE_URL: http://cart-service:4008
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:4005:4005"
    depends_on:
      - postgres
      - redis
      - kafka
      - rabbitmq
    networks:
      - shopease-network

  payment-service:
    build:
      context: .
      dockerfile: server/payment-service/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    environment:
      PORT: 4006
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopease}:${POSTGRES_PASSWORD}@postgres:5432/payment_db?schema=public
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: payment-service
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-local-disabled}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-local-disabled}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-local-disabled}
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - postgres
      - kafka
    networks:
      - shopease-network

  inventory-service:
    build:
      context: .
      dockerfile: server/inventory-service/Dockerfile
    container_name: inventory-service
    restart: unless-stopped
    environment:
      PORT: 4007
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopease}:${POSTGRES_PASSWORD}@postgres:5432/inventory_db?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: inventory-service
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - shopease-network

  cart-service:
    build:
      context: .
      dockerfile: server/cart-service/Dockerfile
    container_name: cart-service
    restart: unless-stopped
    environment:
      PORT: 4008
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CATALOG_SERVICE_URL: http://catalog-service:4003
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - redis
      - catalog-service
    networks:
      - shopease-network

  worker-service:
    build:
      context: .
      dockerfile: server/worker-service/Dockerfile
    container_name: worker-service
    restart: unless-stopped
    environment:
      PORT: 4011
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-shopease}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      USER_SERVICE_URL: http://user-service:4001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
    depends_on:
      - rabbitmq
      - user-service
    networks:
      - shopease-network

  api-gateway:
    build:
      context: .
      dockerfile: server/api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ALLOWED_ORIGINS: http://localhost:3000
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      USER_SERVICE_URL: http://user-service:4001
      SEARCH_SERVICE_URL: http://search-service:4002
      CATALOG_SERVICE_URL: http://catalog-service:4003
      NOTIFICATION_SERVICE_URL: http://notification-service:4004
      ORDER_SERVICE_URL: http://order-service:4005
      PAYMENT_SERVICE_URL: http://payment-service:4006
      INVENTORY_SERVICE_URL: http://inventory-service:4007
      CART_SERVICE_URL: http://cart-service:4008
      AI_SERVICE_URL: http://ai-service:4009
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - redis
      - user-service
      - search-service
      - catalog-service
      - order-service
      - payment-service
      - inventory-service
      - cart-service
      - ai-service
    networks:
      - shopease-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - api-gateway
      - order-service
    networks:
      - shopease-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - shopease-network

  kibana:
    profiles: ["tools"]
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    restart: always
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - shopease-network

  # ─── Observability ────────────────────────────────────────────────────────
  prometheus:
    profiles: ["tools"]
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets Prometheus scrape services running on the host (npm run dev)
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # http://localhost:9090
    networks:
      - shopease-network

  grafana:
    profiles: ["tools"]
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000" # http://localhost:3001 — add Prometheus (http://prometheus:9090) as a data source
    networks:
      - shopease-network

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  es_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  shopease-network:
    driver: bridge
